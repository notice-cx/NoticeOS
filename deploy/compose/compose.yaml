# Application slice: use explicitly prepared services on the named network.
# No database setup, migration, remote image publishing or service adoption.
services:
  noticeos:
    image: ${NOTICEOS_APP_IMAGE:?Set the exact locally built application image}
    user: "${NOTICEOS_APP_UID:-1000}:${NOTICEOS_APP_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    stop_grace_period: 15s
    environment:
      TOWER_ALLOWED_HOSTS: ${TOWER_ALLOWED_HOSTS:-}
      # The installation as this host sees it, for the Tower's Settings > Installation.
      NOTICEOS_HOST_FOLDER: ${NOTICEOS_INSTALLATION:-}
      NOTICEOS_HOST_TOWER_ADDRESS: ${NOTICEOS_TOWER_BIND:-127.0.0.1}
      NOTICEOS_HOST_TOWER_PORT: ${NOTICEOS_TOWER_PORT:?Choose a Tower port}
      NOTICEOS_HOST_POSTGRES_PORT: ${NOTICEOS_POSTGRES_PORT:-5432}
      NOTICEOS_HOST_TASK_PORT: ${NOTICEOS_DOLT_PORT:-}
      NOTICEOS_HOST_LAUNCHER: ${NOTICEOS_COMMANDS:-}
    ports:
      # Loopback unless the installation chooses its network (NOTICEOS_TOWER_BIND).
      - "${NOTICEOS_TOWER_BIND:-127.0.0.1}:${NOTICEOS_TOWER_PORT:?Choose a Tower port}:5173"
    volumes:
      - type: bind
        source: ${NOTICEOS_STATE_DIR:?Set an absolute prepared installation folder}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${NOTICEOS_SPOKES_DIR:?Set an absolute synthetic or declared spoke folder}
        target: /spokes
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:mode=1777
      - /opt/noticeos/apps/tower/node_modules/.vite-temp:mode=1777
    networks:
      - installation
networks:
  installation:
    external: true
    name: ${NOTICEOS_NETWORK:?Name the explicit installation network}
