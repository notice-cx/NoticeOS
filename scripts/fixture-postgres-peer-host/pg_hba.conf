# Test fixture: a Postgres server installed on the machine itself, whose
# owner and maintenance logins are the operator's own account on the local
# socket, with no password (peer). It is what `pnpm postgres:migrate` and
# `pnpm postgres:import` mean by their --socket way in, which the proofs in
# scripts/postgres-apply.test.mjs and
# scripts/postgres-apply.test.mjs copy into a throwaway cluster
# with a pg_ident.conf "noticeos" map for the account. The installation's own
# profile is db/postgres/host/ (Compose, logins by password over TCP).
#
# TYPE  DATABASE  USER          ADDRESS        METHOD
local   all       all                          peer map=noticeos
host    all       noticeos_app  127.0.0.1/32   scram-sha-256
host    all       noticeos_app  ::1/128        scram-sha-256
