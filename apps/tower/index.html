<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1019" />
    <link rel="stylesheet" href="/brand/notice.css" />
    <link
      rel="preload"
      href="/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/StackSansNotch-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The Notice favicon set, as www.notice.cx serves it (D35): the dark N
         for light tab bars, the white N for dark ones, and the dark N on white
         for the home screen. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/notice-icon-32.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/notice-icon-32-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/notice-icon-16-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/brand/notice-icon-180.png" />
    <meta name="application-name" content="NoticeOS" />
    <meta name="apple-mobile-web-app-title" content="NoticeOS" />
    <!-- What a search result, a shared link and a fresh tab say before the
         app names its page (src/lib/document-title.ts). An installation is
         one operator's private desk, so it stays out of search. The public
         demo build replaces this block with vite/demo-head.html
         (vite/document-head.ts). -->
    <!-- document-head:begin -->
    <title>NoticeOS · Your startup, in clear view</title>
    <meta name="description" content="A self-hosted operating desk for your websites and software products. See traffic, revenue, costs, alerts and work together, on your laptop, phone or TV." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:site_name" content="NoticeOS" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NoticeOS · Your startup, in clear view" />
    <meta property="og:description" content="A self-hosted operating desk for your websites and software products: traffic, revenue, costs, alerts and work in one view." />
    <meta name="twitter:card" content="summary" />
    <!-- document-head:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
