version: 2
updates:
  # One root entry covers every pnpm workspace and the shared lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Source-analysis and transpilation use the compiler's JavaScript API.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # The Workers test adapter requires Vitest 4 internals.
      - dependency-name: "vitest"
        versions: ["5.x"]
    groups:
      # The Tower's /tasks pages: each release of the Ntasks UI package in a
      # pull request of its own, every version step included, so the Tower's
      # browser journeys run against it before it merges.
      ntasks-ui:
        patterns: ["@notice-cx/ntasks-ui"]
      cloudflare-toolchain:
        patterns: ["wrangler", "@cloudflare/vite-plugin", "@cloudflare/vitest-pool-workers"]
        update-types: ["minor", "patch"]
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@notice-cx/ntasks-ui", "wrangler", "@cloudflare/vite-plugin", "@cloudflare/vitest-pool-workers"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Docker updater reads both Dockerfiles and Compose image references.
  - package-ecosystem: "docker"
    directories:
      - "/db/dolt/host"
      - "/db/postgres/host"
      - "/deploy/codebase-report"
      - "/deploy/compose"
      - "/deploy/demo"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
