# Build the documentation site (docs/, VitePress) on every pull request that
# touches it, and publish it to GitHub Pages on every push to main. Pages must
# use GitHub Actions as its source (Settings → Pages); a branch source would
# only serve raw files from the root or docs/.
name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/scripts-index.mjs', 'scripts/config-docs.mjs', 'pnpm-lock.yaml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/scripts-index.mjs', 'scripts/config-docs.mjs', 'pnpm-lock.yaml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @noticeos/docs run build
        env:
          DOCS_BASE: /NoticeOS/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
