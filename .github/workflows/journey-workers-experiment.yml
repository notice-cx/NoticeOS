name: Journey workers experiment

# TEMPORARY (issue #17): times the browser journeys on CI's runner at 2, 3
# and 4 Playwright workers, twice each, side by side, so CI's browser job can
# keep the fastest count. The commit that sets the count removes this file.
on:
  push:
    branches: [claude/tender-archimedes-xwom03]

jobs:
  journeys:
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3, 4]
        attempt: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: (test -x /usr/lib/postgresql/18/bin/initdb && test -x /usr/lib/postgresql/17/bin/initdb || (sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-17 postgresql-18)) && echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: pnpm --filter @noticeos/tower run journey:install --with-deps
      - run: pnpm --filter @noticeos/tower run test:journeys
        env:
          JOURNEY_WORKERS: ${{ matrix.workers }}
