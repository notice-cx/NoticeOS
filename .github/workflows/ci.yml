name: CI

on:
  push:
    branches: [main]
  pull_request:

# Five jobs side by side (issue #2): the Tower's unit suite, the other
# workspaces' (ingest, contract, mediavine, postgres), the root script suite,
# the build with the browser journeys, and the UX flow gate. Each gate runs
# once, in one job; `build` is the verdict branch protection requires.
jobs:
  # A pull request that changes only documentation no runtime suite reads
  # skips the unit, browser and flow-gate jobs (issue #4,
  # scripts/ci-scope.mjs). The root script suite reads every tracked Markdown
  # file, so it always runs. A push to main runs everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: node scripts/ci-scope.mjs
        id: scope

  tower-unit:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @noticeos/tower run typecheck
      # The Postgres proofs (bead ro-ujb9.76.15, epic ro-ujb9.76) never skip:
      # PostgreSQL 18's server binaries go on PATH before the first suite that
      # starts a server (installed from PGDG if the runner lacks them), and
      # NOTICEOS_REQUIRE_POSTGRES turns a server that cannot start into a
      # failure. Every job that starts Postgres repeats this step.
      - run: (test -x /usr/lib/postgresql/18/bin/initdb && test -x /usr/lib/postgresql/17/bin/initdb || (sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-17 postgresql-18)) && echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: pnpm --filter @noticeos/tower run test
        env:
          NOTICEOS_REQUIRE_POSTGRES: '1'
          # The suite has the runner to itself (scripts/unit-test-workers.mts).
          UNIT_TEST_WORKERS: 100%

  ingest-unit:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!@noticeos/tower' typecheck
      - run: (test -x /usr/lib/postgresql/18/bin/initdb && test -x /usr/lib/postgresql/17/bin/initdb || (sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-17 postgresql-18)) && echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: pnpm -r --filter '!@noticeos/tower' test
        env:
          NOTICEOS_REQUIRE_POSTGRES: '1'
          UNIT_TEST_WORKERS: 100%

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: (test -x /usr/lib/postgresql/18/bin/initdb && test -x /usr/lib/postgresql/17/bin/initdb || (sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-17 postgresql-18)) && echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: pnpm test:scripts
        env:
          NOTICEOS_REQUIRE_POSTGRES: '1'
          NOTICEOS_TEST_POSTGRES17_BIN: /usr/lib/postgresql/17/bin

  browser:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The journeys' run starts one throwaway Postgres for its fixture servers.
      - run: (test -x /usr/lib/postgresql/18/bin/initdb && test -x /usr/lib/postgresql/17/bin/initdb || (sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-17 postgresql-18)) && echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: pnpm -r build
      # The fifth gate is `pnpm test:journeys`, split across this job and the
      # next so neither waits on the other: the isolated browser journeys
      # here, the journey harness and the UX flow gate there. The journeys'
      # types are checked in tower-unit.
      - run: pnpm --filter @noticeos/tower run journey:install --with-deps
      - run: pnpm --filter @noticeos/tower run test:journeys
        env:
          # Browser workers, each with its own fixture server (bead
          # ro-ujb9.167). Unset, a run takes half the machine's cores, which
          # on a small runner is 1. Timed on this runner, twice each, in run
          # 37532105051: 4 workers took 5:52 and 6:21, 3 took 7:34 and 7:48,
          # and 2 took 5:21 and 7:56 (issue #17).
          JOURNEY_WORKERS: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-journey-browser-evidence
          path: |
            apps/tower/e2e/playwright-report/
            apps/tower/e2e/test-results/
          retention-days: 14

  flow-gate:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The harness and each flow-gate lane start their own fixture server on
      # a throwaway Postgres.
      - run: (test -x /usr/lib/postgresql/18/bin/initdb && test -x /usr/lib/postgresql/17/bin/initdb || (sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-17 postgresql-18)) && echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: pnpm --filter @noticeos/tower run journey:install --with-deps
      - run: pnpm --filter @noticeos/tower run test:journey-harness
      # The UX flow gate (bead ro-ujb9.95) walks every declared operator flow
      # and fails when one gains a step, an empty step, a repeated check, a
      # duplicate status or an ungrouped list (apps/tower/ux-flows.json).
      - run: pnpm --filter @noticeos/tower run test:ux-flows
        env:
          # Flow-gate lanes, each with its own fixture server (bead ro-ujb9.167).
          JOURNEY_WORKERS: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-flow-gate-evidence
          path: apps/tower/e2e/ux-flows-results/
          retention-days: 14

  # The one check branch protection requires: every job passed, or the scope
  # job skipped the runtime jobs for a documentation-only pull request.
  build:
    needs: [scope, tower-unit, ingest-unit, scripts, browser, flow-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: jq -e --arg runtime "$RUNTIME" '.scope.result == "success" and .scripts.result == "success" and ([."tower-unit", ."ingest-unit", .browser, ."flow-gate"] | map(.result) | all(. == "success" or (. == "skipped" and $runtime == "false")))' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
