name: Journey browser
description: Install the journeys' Chromium and its Linux system libraries, taking the libraries from the cache a previous run saved.
# Ubuntu's mirror can take minutes to send the libraries to a runner that
# lacks them (522 s in one smoke job), so apt keeps what it downloads in a
# folder whose packages the cache saves once per Playwright version. Only the
# .deb files: apt's partial/ folder is its own user's and unreadable here.
runs:
  using: composite
  steps:
    - id: playwright
      shell: bash
      run: echo "version=$(node -p "require('./apps/tower/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - id: libraries
      uses: actions/cache/restore@v6
      with:
        path: ~/chromium-libraries/*.deb
        key: chromium-libraries-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - shell: bash
      run: |
        mkdir -p ~/chromium-libraries/partial
        sudo chown _apt ~/chromium-libraries/partial
        printf 'Dir::Cache::Archives "%s/chromium-libraries/";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/90-chromium-libraries > /dev/null
    - shell: bash
      run: pnpm --filter @noticeos/tower run journey:install --with-deps
    # A runner that already had every library downloads nothing; an empty
    # folder saved under this key would stop a later runner's download from
    # ever being kept.
    - id: downloaded
      shell: bash
      run: echo "packages=$(find ~/chromium-libraries -maxdepth 1 -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
    - if: steps.libraries.outputs.cache-hit != 'true' && steps.downloaded.outputs.packages != '0'
      uses: actions/cache/save@v6
      with:
        path: ~/chromium-libraries/*.deb
        key: ${{ steps.libraries.outputs.cache-primary-key }}
