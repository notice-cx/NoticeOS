# NoticeOS Postgres service: who may connect, and how.
# compose.yaml mounts this file read-only and points the server at it
# (hba_file), so it is the whole rule set: any connection no line admits is
# refused.
#
# Inside the container, on its own socket: the cluster's superuser, and only
# it, with nothing to present. Only a process started inside the container
# reaches that socket (the image's first start, its health check, and the
# backup and restore commands in README.md); starting one there takes the
# container app's own rights.
#
# Over TCP: the three NoticeOS logins, each only to the noticeos database and
# only with its password (a SCRAM-SHA-256 exchange; the server holds only the
# verifier). Where TCP reaches from is compose.yaml's to decide: the port is
# published on 127.0.0.1 alone. The superuser has no TCP line, so no
# password, right or wrong, lets it in over the network.
#
# TYPE  DATABASE  USER            ADDRESS  METHOD
local   all       postgres                 trust
host    noticeos  noticeos_app    all      scram-sha-256
host    noticeos  noticeos_owner  all      scram-sha-256
host    noticeos  noticeos_maint  all      scram-sha-256
