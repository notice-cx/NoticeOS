    <text x="32" y="77" fill="#A4AEC3" font-size="17">Evidence, attention and the work behind it</text>
    <g fill="#151A26" stroke="#30394E" stroke-width="1">
      <rect x="24" y="104" width="288" height="128" rx="12"/>
      <rect x="328" y="104" width="288" height="128" rx="12"/>
      <rect x="24" y="248" width="288" height="128" rx="12"/>
      <rect x="328" y="248" width="288" height="128" rx="12"/>
    </g>
