<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title description">
  <title id="title">Your business evidence and work, together</title>
  <desc id="description">Four parts of NoticeOS: traffic and signals; revenue and costs; tasks and workflows; changes and outcomes. This is a product overview diagram, not a screenshot.</desc>
