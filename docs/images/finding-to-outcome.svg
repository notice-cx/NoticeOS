<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="title desc">
<title id="title">From a finding to its outcome</title>
<desc id="desc">Seven steps linked by one task id, ex-14: 1 a finding appears (a query lost its ranking); 2 File task creates ex-14 on the site's project; 3 every commit names ex-14; 4 the task closes with a commit as evidence; 5 the change is logged on the Activity tab with reference ex-14; 6 an outcome check is registered against the change; 7 the verdict, here Improvement confirmed, is posted back onto ex-14. Closing a task records a decision; the verdict is the result.</desc>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.flow { stroke-dasharray: 2 10; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.breathe { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s cubic-bezier(.2,.6,.35,1) infinite; }
@keyframes breathe { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.lit { opacity: 0; animation: lit 13.0s linear infinite; }
@keyframes lit { 0% { opacity: 0; } 1.15% { opacity: 1; } 11.54% { opacity: 1; } 14.62%, 100% { opacity: 0; } }
.key { animation: key 13.0s cubic-bezier(.2,.8,.2,1) infinite both; }
@keyframes key { 0% { opacity: 0; transform: translateY(4px); } 2.31% { opacity: 1; transform: none; } 96.15% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .lit { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .packet, .breathe { display: none; }
}
</style>
