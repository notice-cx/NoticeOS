<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="title desc">
<title id="title">When an alert fires</title>
<desc id="desc">Two bar charts. Recipes saved averages 6.2 a day; today is 0, a day that low has a probability of about 1 in 500, under the 1 in 100 sensitivity, so a Warning anomaly alert is raised: Recipes saved: 0 in the last 24 hours (average 6.2 a day). Newsletter sign-ups average 1.5 a day, too few for one empty day to alert on, so the last four days are tested together: 0 sign-ups against about 6 expected has a probability of about 1 in 400, so a Warning anomaly alert is raised.</desc>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.flow { stroke-dasharray: 2 10; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.breathe { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s cubic-bezier(.2,.6,.35,1) infinite; }
@keyframes breathe { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 12s cubic-bezier(.2,.8,.2,1) infinite both; }
@keyframes grow { 0% { transform: scaleY(0); opacity: 1; } 7% { transform: scaleY(1); } 94% { transform: scaleY(1); opacity: 1; } 98%, 100% { transform: scaleY(1); opacity: 0; } }
.late { animation: late 12s ease-out infinite both; }
@keyframes late { 0%, 14% { opacity: 0; transform: translateY(6px); } 18% { opacity: 1; transform: none; } 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
.later { animation: later 12s ease-out infinite both; }
@keyframes later { 0%, 20% { opacity: 0; transform: translateX(10px); } 25% { opacity: 1; transform: none; } 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
@keyframes ring { 0% { opacity: .8; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.4); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .packet, .breathe { display: none; }
}
</style>
