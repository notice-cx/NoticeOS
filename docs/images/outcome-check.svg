<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" role="img" aria-labelledby="title desc">
<title id="title">An outcome check</title>
<desc id="desc">A line chart of daily Search Console clicks for 200 recipe pages over 56 days. The first 28 days are the baseline; titles are rewritten on day 0 and the surfaces are left unchanged afterwards. An improvement threshold of +5% is set in advance. Interim readings on days 7 and 14 are +2% and +5%; the final reading on day 28 is +8%, above the threshold, so the check closes as Improvement confirmed. The other verdicts are Decline confirmed, No clear change and Could not be measured.</desc>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.flow { stroke-dasharray: 2 10; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.breathe { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s cubic-bezier(.2,.6,.35,1) infinite; }
@keyframes breathe { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 12s linear infinite both; }
@keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 30% { stroke-dashoffset: 0; } 94% { opacity: 1; } 98%, 100% { stroke-dashoffset: 0; opacity: 0; } }
.pop { transform-box: fill-box; transform-origin: center; animation: pop 12s cubic-bezier(.2,.8,.2,1) infinite both; }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 3% { opacity: 1; transform: none; } 79% { opacity: 1; } 83%, 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .packet, .breathe { display: none; }
}
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".045"/></pattern></defs><rect width="760" height="524" rx="20" fill="#0d1019"/><rect width="760" height="524" rx="20" fill="url(#dots)"/><rect x=".5" y=".5" width="759" height="523" rx="19.5" fill="none" stroke="#1e2636"/><rect x="32" y="28" width="696" height="468" rx="16" fill="#151a26" stroke="#303a4f"/><path d="M48 29.5H712" stroke="#ffffff" stroke-opacity=".07"/><text x="54" y="62" font-size="12.5" fill="#a4aec3" font-weight="600" letter-spacing="1.4">SEARCH CONSOLE CLICKS, 200 RECIPE PAGES</text><text x="54" y="84" font-size="13.5" fill="#a4aec3">One outcome check: 28 days of baseline, then checks 7, 14 and 28 days after the change</text><path d="M90 311.0H670" stroke="#2d333b" stroke-width=".8"/><text x="80" y="315.0" font-size="11.5" fill="#a4aec3" text-anchor="end">350</text><path d="M90 252.7H670" stroke="#2d333b" stroke-width=".8"/><text x="80" y="256.6666666666667" font-size="11.5" fill="#a4aec3" text-anchor="end">400</text><path d="M90 194.3H670" stroke="#2d333b" stroke-width=".8"/><text x="80" y="198.33333333333334" font-size="11.5" fill="#a4aec3" text-anchor="end">450</text><path d="M90 136.0H670" stroke="#2d333b" stroke-width=".8"/><text x="80" y="140.0" font-size="11.5" fill="#a4aec3" text-anchor="end">500</text><rect x="90.0" y="130" width="290.0" height="216" fill="#f0f3ff" fill-opacity=".035"/><rect x="380.0" y="130" width="290.0" height="216" fill="#4a91f8" fill-opacity=".06"/><text x="235.0" y="122" font-size="12" fill="#a4aec3" font-weight="600" text-anchor="middle">Baseline, 28 days</text><text x="525.0" y="122" font-size="12" fill="#a4aec3" font-weight="600" text-anchor="middle">After the change: surfaces left unchanged</text><path d="M90.0 251.2H670.0" stroke="#f0f3ff" stroke-opacity=".55" stroke-dasharray="5 4"/><path d="M380.0 227.8H670.0" stroke="#69d99a" stroke-opacity=".75" stroke-dasharray="2 4" stroke-width="1.5"/><text x="678.0" y="265.16464443820144" font-size="11.5" fill="#a4aec3">baseline</text><text x="678.0" y="209.75620999344483" font-size="11.5" fill="#69d99a">+5% set</text><text x="678.0" y="223.75620999344483" font-size="11.5" fill="#69d99a">in advance</text><path d="M380.0 130V346" stroke="#f0f3ff" stroke-opacity=".8" stroke-width="1.5"/><rect x="318.0" y="312" width="124" height="24" rx="12" fill="#1e2636" stroke="#303a4f"/><text x="380.0" y="328.5" font-size="12" fill="#f0f3ff" font-weight="600" text-anchor="middle">Titles rewritten</text><text x="380.0" y="372.5" font-size="11.5" fill="#a4aec3" text-anchor="middle">day 0</text><path d="M90.0 269.8 L100.4 221.6 L110.7 205.9 L121.1 245.9 L131.4 284.9 L141.8 285.4 L152.1 271.9 L162.5 237.3 L172.9 245.1 L183.2 240.2 L193.6 228.3 L203.9 260.4 L214.3 264.5 L224.6 265.2 L235.0 254.1 L245.4 231.2 L255.7 182.4 L266.1 242.7 L276.4 277.5 L286.8 299.4 L297.1 276.9 L307.5 250.6 L317.9 232.2 L328.2 221.7 L338.6 234.6 L348.9 257.4 L359.3 270.2 L369.6 275.4 L380.0 277.7 L390.4 211.0 L400.7 231.6 L411.1 226.0 L421.4 269.8 L431.8 264.1 L442.1 265.5 L452.5 221.7 L462.9 143.4 L473.2 186.9 L483.6 190.0 L493.9 251.1 L504.3 253.4 L514.6 231.6 L525.0 213.6 L535.4 177.3 L545.7 173.6 L556.1 209.5 L566.4 215.4 L576.8 254.1 L587.1 207.7 L597.5 214.1 L607.9 166.5 L618.2 170.2 L628.6 174.1 L638.9 229.2 L649.3 225.0 L659.6 233.9 L670.0 184.1" pathLength="1" class="draw" fill="none" stroke="#4a91f8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g class="pop" style="animation-delay:2.25s"><path d="M452.5 346V221.7" stroke="#f0f3ff" stroke-opacity=".35" stroke-dasharray="2 3"/><circle cx="452.5" cy="221.7" r="5" fill="#0d1019" stroke="#f0f3ff" stroke-width="2.2"/><text x="452.5" y="372.5" font-size="11.5" fill="#a4aec3" text-anchor="middle">day 7</text><rect x="418.5" y="181.7" width="68" height="24" rx="8" fill="#1e2636" stroke="#303a4f"/><text x="452.5" y="198.24472908781883" font-size="13" fill="#f0f3ff" font-weight="700" text-anchor="middle">+2%</text></g><g class="pop" style="animation-delay:2.70s"><path d="M525.0 346V213.6" stroke="#f0f3ff" stroke-opacity=".35" stroke-dasharray="2 3"/><circle cx="525.0" cy="213.6" r="5" fill="#0d1019" stroke="#f0f3ff" stroke-width="2.2"/><text x="525.0" y="372.5" font-size="11.5" fill="#a4aec3" text-anchor="middle">day 14</text><rect x="491.0" y="173.6" width="68" height="24" rx="8" fill="#1e2636" stroke="#303a4f"/><text x="525.0" y="190.07833504947538" font-size="13" fill="#f0f3ff" font-weight="700" text-anchor="middle">+5%</text></g><g class="pop" style="animation-delay:3.60s"><path d="M670.0 346V184.1" stroke="#f0f3ff" stroke-opacity=".35" stroke-dasharray="2 3"/><circle cx="670.0" cy="184.1" r="5" fill="#0d1019" stroke="#69d99a" stroke-width="2.2"/><rect x="636.0" y="144.1" width="68" height="24" rx="8" fill="#1e2636" stroke="#69d99a"/><text x="670.0" y="160.57520974800838" font-size="13" fill="#69d99a" font-weight="700" text-anchor="middle">+8%</text></g><text x="670.0" y="372.5" font-size="11.5" fill="#a4aec3" text-anchor="middle">day 28</text><text x="90.0" y="372.5" font-size="11.5" fill="#a4aec3">day −28</text><g class="pop" style="animation-delay:3.80s"><rect x="54.0" y="404" width="320.0" height="32" rx="10" fill="#172f25" stroke="#69d99a" stroke-opacity=".7"/></g><text x="70.0" y="425" font-size="13" fill="#69d99a" font-weight="700">▲</text><text x="90.0" y="425" font-size="13.5" fill="#f0f3ff" font-weight="600">Improvement confirmed</text><text x="360.0" y="425" font-size="12" fill="#69d99a" text-anchor="end">this check, day 28</text><rect x="386.0" y="404" width="320.0" height="32" rx="10" fill="none" stroke="#303a4f"/><text x="402.0" y="425" font-size="13" fill="#f5c06a" font-weight="700">▼</text><text x="422.0" y="425" font-size="13.5" fill="#a4aec3">Decline confirmed</text><rect x="54.0" y="444" width="320.0" height="32" rx="10" fill="none" stroke="#303a4f"/><text x="70.0" y="465" font-size="13" fill="#a4aec3" font-weight="700">=</text><text x="90.0" y="465" font-size="13.5" fill="#a4aec3">No clear change</text><rect x="386.0" y="444" width="320.0" height="32" rx="10" fill="none" stroke="#303a4f"/><text x="402.0" y="465" font-size="13" fill="#a4aec3" font-weight="700">?</text><text x="422.0" y="465" font-size="13.5" fill="#a4aec3">Could not be measured</text>
</svg>
