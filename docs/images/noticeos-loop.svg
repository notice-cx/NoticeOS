<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="title desc">
<title id="title">The NoticeOS loop</title>
<desc id="desc">Five steps in a circle, run over and over for every asset: Sense collects every asset's data (Portfolio and Alerts); Attribute credits a change only on evidence (a asset's Activity tab); Decide ranks work by expected money against cost (Tasks); Act: a change is built, checked by someone other than its builder, and shipped by you (Tasks); Learn compares predictions against results (outcome checks), which feeds the next decision. In the centre is the ledger of revenue and cost per asset and month, which is never rewritten.</desc>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.flow { stroke-dasharray: 2 10; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.breathe { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s cubic-bezier(.2,.6,.35,1) infinite; }
@keyframes breathe { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.lit { opacity: 0; animation: lit 10s linear infinite; }
@keyframes lit { 0% { opacity: 0; } 3% { opacity: 1; } 17% { opacity: 1; } 22%, 100% { opacity: 0; } }
.num { animation: num 10s linear infinite; }
@keyframes num { 0% { fill: #1e2636; } 3% { fill: #f0f3ff; } 17% { fill: #f0f3ff; } 22%, 100% { fill: #1e2636; } }
.numt { animation: numt 10s linear infinite; }
@keyframes numt { 0% { fill: #a4aec3; } 3% { fill: #0d1019; } 17% { fill: #0d1019; } 22%, 100% { fill: #a4aec3; } }
@media (prefers-reduced-motion: reduce) { .lit { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .packet, .breathe { display: none; }
}
</style>
