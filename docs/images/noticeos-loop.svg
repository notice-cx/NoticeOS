chor="middle" class="numt" style="animation-delay:-0.35s">1</text><text x="319.0" y="82.0" font-size="18" fill="#f0f3ff" font-weight="600">Sense</text><text x="287.0" y="109.0" font-size="14" fill="#a4aec3">collect every asset's data</text><rect x="287.0" y="120.0" width="110" height="20" rx="6" fill="#0d1019" stroke="#303a4f"/><text x="295.0" y="134.0" font-size="12" fill="#f0f3ff">Portfolio · Alerts</text><rect x="466.81975538939196" y="189.72446517001094" width="222" height="104" rx="14" fill="#151a26" stroke="#303a4f"/><path d="M480.81975538939196 191.22446517001094H674.819755389392" stroke="#ffffff" stroke-opacity=".07"/><rect class="lit" style="animation-delay:1.65s" x="466.81975538939196" y="189.72446517001094" width="222" height="104" rx="14" fill="#f0f3ff" fill-opacity=".04" stroke="#f0f3ff" stroke-opacity=".55" stroke-width="1.5"/><circle class="num" style="animation-delay:1.65s" cx="494.81975538939196" cy="219.72446517001094" r="12" fill="#1e2636" stroke="#303a4f"/><text x="494.81975538939196" y="224.72446517001094" font-size="13" fill="#a4aec3" font-weight="700" text-anchor="middle" class="numt" style="animation-delay:1.65s">2</text><text x="516.819755389392" y="225.72446517001094" font-size="18" fill="#f0f3ff" font-weight="600">Attribute</text><text x="484.81975538939196" y="252.72446517001094" font-size="14" fill="#a4aec3">credit changes on evidence</text><rect x="484.81975538939196" y="263.72446517001094" width="97" height="20" rx="6" fill="#0d1019" stroke="#303a4f"/><text x="492.81975538939196" y="277.72446517001094" font-size="12" fill="#f0f3ff">Activity tab</text><rect x="391.2593324768344" y="422.27553482998906" width="222" height="104" rx="14" fill="#151a26" stroke="#303a4f"/><path d="M405.2593324768344 423.77553482998906H599.2593324768344" stroke="#ffffff" stroke-opacity=".07"/><rect class="lit" style="animation-delay:3.65s" x="391.2593324768344" y="422.27553482998906" width="222" height="104" rx="14" fill="#f0f3ff" fill-opacity=".04" stroke="#f